[project]
name = "tov"
dynamic = ["version"]
description = "Rewrite text in a given tone of voice using Gemini, from the command line or a local web UI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tom Dyson" }]
keywords = ["gemini", "llm", "rewrite", "tone of voice", "cli"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing",
]
dependencies = ["google-genai>=1.0", "httpx"]

[project.urls]
Homepage = "https://github.com/tomdyson/tov"
Issues = "https://github.com/tomdyson/tov/issues"

[project.scripts]
tov = "tov:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "tov.py"

[tool.hatch.build.targets.wheel]
only-include = ["tov.py"]

[tool.hatch.build.targets.sdist]
include = ["tov.py", "README.md", "LICENSE", "pyproject.toml"]
